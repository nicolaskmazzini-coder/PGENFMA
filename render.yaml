# Render Blueprint - PGENFMA
# Deploy automático a cada push no GitHub
services:
  - type: web
    name: pgenfma
    runtime: node
    plan: free
    region: frankfurt
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
