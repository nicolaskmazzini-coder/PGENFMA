<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PGENFMA - Cadastrar negócio</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
</head>
<body>

  <header>
    <a class="brand" href="index.html"><img class="logo-header" src="../img/logo.svg" alt=""> PGENFMA</a>
    <a href="login-empresa.html">&larr; Voltar</a>
    <h1>Cadastrar meu negócio</h1>
    <nav class="topnav">
      <a href="calendario.html">Calendário</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="busca.html">Buscar</a>
      <a href="perfil.html"><span class="avatar-mini" data-avatar>P</span> Perfil</a>
    </nav>
  </header>

  <main>
    <p id="erro_cadastro" class="erro-msg" hidden></p>
    <form id="form_cadastro_empresa" action="agenda-prestador.html" method="get">
      <label for="txt_nome_negocio_cadastro_empresa">Nome do negócio</label>
      <input type="text" id="txt_nome_negocio_cadastro_empresa" name="nome-negocio" placeholder="Ex: Barbearia Vintage" required>

      <label for="txt_categoria_cadastro_empresa">Categoria</label>
      <select id="txt_categoria_cadastro_empresa" name="categoria" required>
        <option value="">Selecione</option>
        <option value="barbearia">Barbearia</option>
        <option value="salao">Salão de beleza</option>
        <option value="clinica">Clínica</option>
        <option value="outro">Outro</option>
      </select>

      <label for="txt_cnpj_cadastro_empresa">CNPJ</label>
      <input type="text" id="txt_cnpj_cadastro_empresa" name="cnpj" placeholder="00.000.000/0000-00" required>

      <label for="txt_endereco_cadastro_empresa">Endereço</label>
      <input type="text" id="txt_endereco_cadastro_empresa" name="endereco" placeholder="Rua, número, bairro" required>

      <label for="txt_email_cadastro_empresa">E-mail</label>
      <input type="email" id="txt_email_cadastro_empresa" name="email" placeholder="empresa@email.com" required>

      <label for="txt_senha_cadastro_empresa">Senha</label>
      <input type="password" id="txt_senha_cadastro_empresa" name="senha" placeholder="********" required>

      <button type="submit" id="btn_cadastrar_negocio">Cadastrar negócio</button>
    </form>

    <a href="login-empresa.html">Já tenho conta</a>
  </main>

<script src="../js/toast.js"></script>
<script src="../js/ui.js"></script>
<script>
  // Cadastro local do negócio: valida, salva neste navegador e entra direto.
  document.getElementById('form_cadastro_empresa').addEventListener('submit', (e) => {
    e.preventDefault();
    const erro = document.getElementById('erro_cadastro');
    const negocio = document.getElementById('txt_nome_negocio_cadastro_empresa').value.trim();
    const categoria = document.getElementById('txt_categoria_cadastro_empresa').value;
    const cnpj = document.getElementById('txt_cnpj_cadastro_empresa').value.trim();
    const endereco = document.getElementById('txt_endereco_cadastro_empresa').value.trim();
    const email = document.getElementById('txt_email_cadastro_empresa').value.trim().toLowerCase();
    const senha = document.getElementById('txt_senha_cadastro_empresa').value;

    if (!categoria) {
      erro.hidden = false;
      erro.textContent = 'Escolha a categoria do negócio.';
      return;
    }
    if (senha.length < 4) {
      erro.hidden = false;
      erro.textContent = 'A senha deve ter ao menos 4 caracteres.';
      return;
    }

    localStorage.setItem('pgenfma_empresa', JSON.stringify({ negocio, categoria, cnpj, endereco, email, senha }));
    localStorage.setItem('pgenfma_sessao', JSON.stringify({ tipo: 'empresa', email }));
    window.location.href = 'agenda-prestador.html';
  });
</script>

</body>
</html>
