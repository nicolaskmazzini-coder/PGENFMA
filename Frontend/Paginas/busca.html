<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PGENFMA - Encontrar um horário</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
</head>
<body>

  <header>
    <a class="brand" href="index.html"><img class="logo-header" src="../img/logo.svg" alt=""> PGENFMA</a>
    <h1>Encontrar um horário</h1>
    <nav class="topnav">
      <a href="calendario.html">Calendário</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="busca.html">Buscar</a>
      <a href="sobre-nos.html">Sobre</a>
      <a href="perfil.html"><span class="avatar-mini" data-avatar>P</span> Perfil</a>
    </nav>
  </header>

  <main>

    <form action="busca.html" method="get">
      <label for="txt_busca">Buscar</label>
      <input type="search" id="txt_busca" name="busca" placeholder="Buscar barbearia, salão, clínica...">
      <button type="submit" id="btn_buscar">Buscar</button>
    </form>

    <section>
      <ul id="lista_resultados"></ul>
      <p id="status_busca"></p>
    </section>

  </main>

<script src="../js/toast.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/prestadores.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const termoInicial = (params.get('busca') || '').trim();
  document.getElementById('txt_busca').value = termoInicial;

  function renderizar(termo) {
    const lista = document.getElementById('lista_resultados');
    const status = document.getElementById('status_busca');
    const t = termo.toLowerCase();
    const resultados = PRESTADORES.filter((p) =>
      !t ||
      p.nome.toLowerCase().includes(t) ||
      p.categoria.toLowerCase().includes(t) ||
      p.bairro.toLowerCase().includes(t)
    );
    lista.innerHTML = '';
    if (!resultados.length) {
      status.innerHTML = '<div class="vazio"><span class="vazio-ico">🔍</span>Nenhum resultado para "' + termo + '".</div>';
      return;
    }
    status.innerHTML = '';
    resultados.forEach((p) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = 'detalhes-prestador.html?id=' + p.id;
      a.innerHTML = '<p>' + p.nome + '</p>' +
        '<span class="badge">⭐ ' + p.estrelas + ' · ' + p.avaliacoes + ' avaliações</span>' +
        '<p class="t-meta">' + p.categoria + ' · ' + p.bairro + '</p>';
      li.appendChild(a);
      lista.appendChild(li);
    });
  }

  document.querySelector('form').addEventListener('submit', (e) => {
    e.preventDefault();
    renderizar(document.getElementById('txt_busca').value.trim());
  });

  renderizar(termoInicial);
</script>

</body>
</html>
