<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PGENFMA - Entrar como prestador</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
</head>
<body>

  <header>
    <a class="brand" href="index.html"><img class="logo-header" src="../img/logo.svg" alt=""> PGENFMA</a>
    <a href="index.html">&larr; Voltar</a>
    <h1>Entrar como prestador</h1>
    <nav class="topnav">
      <a href="calendario.html">Calendário</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="busca.html">Buscar</a>
      <a href="perfil.html"><span class="avatar-mini" data-avatar>P</span> Perfil</a>
    </nav>
  </header>

  <main>
    <p id="erro_login" class="erro-msg" hidden></p>
    <form id="form_login_empresa" action="agenda-prestador.html" method="get">
      <label for="txt_identificador_login_empresa">E-mail ou CNPJ</label>
      <input type="text" id="txt_identificador_login_empresa" name="identificador" placeholder="empresa@email.com" required>

      <label for="txt_senha_login_empresa">Senha</label>
      <input type="password" id="txt_senha_login_empresa" name="senha" placeholder="********" required>

      <button type="submit" id="btn_entrar_empresa">Entrar</button>
    </form>

    <a href="cadastro-empresa.html">Cadastrar meu negócio</a>
  </main>

<script src="../js/toast.js"></script>
<script src="../js/ui.js"></script>
<script>
  // Login local do prestador: aceita o e-mail ou o nome do negócio + senha do cadastro.
  document.getElementById('form_login_empresa').addEventListener('submit', (e) => {
    e.preventDefault();
    const erro = document.getElementById('erro_login');
    const identificador = document.getElementById('txt_identificador_login_empresa').value.trim().toLowerCase();
    const senha = document.getElementById('txt_senha_login_empresa').value;

    let conta = null;
    try { conta = JSON.parse(localStorage.getItem('pgenfma_empresa')); } catch (err) {}

    if (!conta) {
      erro.hidden = false;
      erro.textContent = 'Nenhum negócio cadastrado neste navegador. Cadastre seu negócio primeiro.';
      return;
    }
    const confereId = conta.email === identificador || conta.negocio.toLowerCase() === identificador;
    if (!confereId || conta.senha !== senha) {
      erro.hidden = false;
      erro.textContent = 'E-mail/CNPJ ou senha incorretos. Confira e tente de novo.';
      return;
    }

    localStorage.setItem('pgenfma_sessao', JSON.stringify({ tipo: 'empresa', email: conta.email }));
    window.location.href = 'agenda-prestador.html';
  });
</script>

</body>
</html>
