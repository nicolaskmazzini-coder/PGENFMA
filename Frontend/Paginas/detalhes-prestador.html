<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAOPS - Barbearia Vintage</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
</head>
<body>

  <header>
    <a class="brand" href="index.html"><img class="logo-header" src="../img/logo.svg" alt=""> SAOPS</a>
    <a href="busca.html">&larr; Voltar</a>
    <h1 id="nome_prestador">Carregando...</h1>
    <nav class="topnav">
      <a href="calendario.html">Calendário</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="busca.html">Buscar</a>
      <a href="sobre-nos.html">Sobre</a>
      <a href="perfil.html"><span class="avatar-mini" data-avatar>P</span> Perfil</a>
    </nav>
  </header>

  <main id="conteudo">
    <div class="sk-card"><div class="sk-linha larga"></div><div class="sk-linha media"></div><div class="sk-linha curta"></div></div>
  </main>

<script src="../js/toast.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/prestadores.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const prestador = buscarPrestadorPorId(params.get('id'));
  const main = document.getElementById('conteudo');

  if (!prestador) {
    document.getElementById('nome_prestador').textContent = 'Não encontrado';
    main.innerHTML = '<section><p>Prestador não encontrado. Volte à busca e escolha novamente.</p></section>';
  } else {
    document.title = 'SAOPS - ' + prestador.nome;
    document.getElementById('nome_prestador').textContent = prestador.nome;
    main.innerHTML =
      '<section>' +
        '<p>' + prestador.estrelas + ' estrelas (' + prestador.avaliacoes + ' avaliações)</p>' +
        '<p>' + prestador.categoria + ' - ' + prestador.bairro + '</p>' +
        '<p>' + prestador.endereco + '</p>' +
        '<p>' + prestador.funcionamento + '</p>' +
      '</section>' +
      '<section><h2>Sobre</h2><p>' + prestador.sobre + '</p></section>' +
      '<section><h2>Serviços</h2><ul>' +
        prestador.servicos.map((s) => '<li>' + s + '</li>').join('') +
      '</ul></section>' +
      '<section><h2>Avaliações recentes</h2><ul>' +
        prestador.avaliacoes_recentes.map((a) =>
          '<li><p>' + a.autor + '</p><p>' + a.nota + '</p><p>' + a.texto + '</p></li>'
        ).join('') +
      '</ul></section>' +
      '<a href="agendamento.html?prestador=' + prestador.id + '">' +
        '<button type="button" id="btn_agendar_horario">Agendar horário</button>' +
      '</a>';
  }
</script>

</body>
</html>
