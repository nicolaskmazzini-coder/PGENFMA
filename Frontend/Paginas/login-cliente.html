<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAOPS - Entrar como cliente</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
</head>
<body>

  <header>
    <a class="brand" href="index.html"><img class="logo-header" src="../img/logo.svg" alt=""> SAOPS</a>
    <a href="index.html">&larr; Voltar</a>
    <h1>Entrar como cliente</h1>
    <nav class="topnav">
      <a href="calendario.html">Calendário</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="busca.html">Buscar</a>
      <a href="sobre-nos.html">Sobre</a>
      <a href="perfil.html"><span class="avatar-mini" data-avatar>P</span> Perfil</a>
    </nav>
  </header>

  <main>
    <p id="erro_login" class="erro-msg" hidden></p>
    <form id="form_login_cliente" action="busca.html" method="get">
      <label for="txt_email_login_cliente">E-mail</label>
      <input type="email" id="txt_email_login_cliente" name="email" placeholder="voce@email.com" required>

      <label for="txt_senha_login_cliente">Senha</label>
      <input type="password" id="txt_senha_login_cliente" name="senha" placeholder="********" required>

      <button type="submit" id="btn_entrar_cliente">Entrar</button>
    </form>

    <div class="social-login">
      <p class="social-titulo">ou entre com</p>
      <div id="google_btn"></div>
      <button type="button" id="ms_btn" class="social-btn">
        <span class="icone-ms"><i></i><i></i><i></i><i></i></span> Entrar com Microsoft
      </button>
    </div>

    <a href="cadastro-cliente.html">Ainda não tenho conta</a>
  </main>

<script src="../js/toast.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/api.js"></script>
<script src="../js/social.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script>
  // Login real via API do backend (sessão por cookie HttpOnly)
  document.getElementById('form_login_cliente').addEventListener('submit', async (e) => {
    e.preventDefault();
    const erro = document.getElementById('erro_login');
    const email = document.getElementById('txt_email_login_cliente').value.trim().toLowerCase();
    const senha = document.getElementById('txt_senha_login_cliente').value;

    const btn = document.getElementById('btn_entrar_cliente');
    btn.disabled = true;
    const r = await entrarConta(email, senha);
    btn.disabled = false;

    if (!r.sucesso) {
      erro.hidden = false;
      erro.textContent = r.erro;
      return;
    }
    salvarSessaoLocal(r.usuario);
    window.location.href = 'busca.html';
  });

  iniciarLoginSocial({ destino: 'busca.html' });
</script>

</body>
</html>
