<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PGENFMA - Entrar como cliente</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
</head>
<body>

  <header>
    <a class="brand" href="index.html"><img class="logo-header" src="../img/logo.svg" alt=""> PGENFMA</a>
    <a href="index.html">&larr; Voltar</a>
    <h1>Entrar como cliente</h1>
    <nav class="topnav">
      <a href="calendario.html">Calendário</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="busca.html">Buscar</a>
      <a href="perfil.html"><span class="avatar-mini" data-avatar>P</span> Perfil</a>
    </nav>
  </header>

  <main>
    <p id="erro_login" class="erro-msg" hidden></p>
    <form id="form_login_cliente" action="busca.html" method="get">
      <label for="txt_email_login_cliente">E-mail</label>
      <input type="email" id="txt_email_login_cliente" name="email" placeholder="voce@email.com" required>

      <label for="txt_senha_login_cliente">Senha</label>
      <input type="password" id="txt_senha_login_cliente" name="senha" placeholder="********" required>

      <button type="submit" id="btn_entrar_cliente">Entrar</button>
    </form>

    <a href="cadastro-cliente.html">Ainda não tenho conta</a>
  </main>

<script src="../js/toast.js"></script>
<script src="../js/ui.js"></script>
<script>
  // Login local: confere e-mail e senha com a conta salva no cadastro.
  document.getElementById('form_login_cliente').addEventListener('submit', (e) => {
    e.preventDefault();
    const erro = document.getElementById('erro_login');
    const email = document.getElementById('txt_email_login_cliente').value.trim().toLowerCase();
    const senha = document.getElementById('txt_senha_login_cliente').value;

    let conta = null;
    try { conta = JSON.parse(localStorage.getItem('pgenfma_cliente')); } catch (err) {}

    if (!conta) {
      erro.hidden = false;
      erro.textContent = 'Nenhuma conta encontrada neste navegador. Crie sua conta primeiro.';
      return;
    }
    if (conta.email !== email || conta.senha !== senha) {
      erro.hidden = false;
      erro.textContent = 'E-mail ou senha incorretos. Confira e tente de novo.';
      return;
    }

    localStorage.setItem('pgenfma_sessao', JSON.stringify({ tipo: 'cliente', email }));
    localStorage.setItem('nome_cliente', conta.nome);
    localStorage.setItem('telefone', conta.telefone || '');
    window.location.href = 'busca.html';
  });
</script>

</body>
</html>
