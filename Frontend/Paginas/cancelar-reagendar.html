<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PGENFMA - Cancelar ou reagendar</title>
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
</head>
<body>

  <header>
    <a class="brand" href="index.html"><img class="logo-header" src="../img/logo.svg" alt=""> PGENFMA</a>
    <a href="perfil.html">&larr; Voltar</a>
    <h1>Cancelar ou reagendar</h1>
    <nav class="topnav">
      <a href="calendario.html">Calendário</a>
      <a href="tarefas.html">Tarefas</a>
      <a href="busca.html">Buscar</a>
      <a href="sobre-nos.html">Sobre</a>
      <a href="perfil.html"><span class="avatar-mini" data-avatar>P</span> Perfil</a>
    </nav>
  </header>

  <main>

    <section id="detalhes">
      <div class="sk-card"><div class="sk-linha larga"></div><div class="sk-linha media"></div><div class="sk-linha curta"></div></div>
    </section>

    <section>
      <h2>O que você quer fazer?</h2>

      <form id="form_reagendar" action="#" method="post">
        <label for="txt_nova_data">Nova data</label>
        <input type="date" id="txt_nova_data" name="nova-data" required>
        <label for="txt_novo_horario">Escolher novo horário</label>
        <select id="txt_novo_horario" name="novo-horario">
          <option value="">Selecione um horário</option>
          <option value="09:00">09:00</option>
          <option value="10:00">10:00</option>
          <option value="11:30">11:30</option>
          <option value="14:00">14:00</option>
          <option value="15:30">15:30</option>
          <option value="16:30">16:30</option>
        </select>
        <button type="submit" id="btn_confirmar_novo_horario">Confirmar novo horário</button>
      </form>

      <form id="form_cancelar" action="#" method="post">
        <label for="txt_motivo_cancelamento">Motivo do cancelamento (opcional)</label>
        <input type="text" id="txt_motivo_cancelamento" name="motivo" placeholder="Ex: Imprevisto de última hora">
        <button type="submit" id="btn_cancelar_agendamento">Cancelar agendamento</button>
      </form>
    </section>

  </main>

<script src="../js/toast.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const box = document.getElementById('detalhes');
  const campoNovaData = document.getElementById('txt_nova_data');
  campoNovaData.min = new Date().toISOString().split('T')[0];
  let atual = null;

  (async () => {
    if (!id) {
      box.innerHTML = '<p>Informe o agendamento: abra esta página pelo "Meu perfil" ou use cancelar-reagendar.html?id=1</p>';
      return;
    }
    const r = await buscarAgendamentoPorId(id);
    if (!r.sucesso) {
      box.innerHTML = '<p>Erro: ' + r.erro + '</p>';
      return;
    }
    atual = r.dados;
    campoNovaData.value = atual.data;
    box.innerHTML = '<p><strong>' + atual.servico + '</strong></p>' +
      '<p>' + atual.nome_cliente + ' — ' + atual.data + ' às ' + atual.horario + '</p>' +
      '<p>Status: ' + atual.status + ' (ID ' + atual.id + ')</p>';
  })();

  document.getElementById('form_reagendar').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!atual) { toast('Carregue um agendamento primeiro.', 'erro'); return; }
    const novaData = campoNovaData.value;
    const novoHorario = document.getElementById('txt_novo_horario').value;
    if (!novaData || !novoHorario) { toast('Escolha a nova data e o novo horário.', 'erro'); return; }
    const r = await atualizarAgendamento(atual.id, {
      nome_cliente: atual.nome_cliente,
      servico: atual.servico,
      data: novaData,
      horario: novoHorario,
      telefone: atual.telefone,
      status: atual.status
    });
    if (r.sucesso) {
      toast('Reagendado para ' + novaData + ' às ' + novoHorario + '!', 'sucesso');
      window.location.href = 'perfil.html';
    } else toast('Erro: ' + r.erro, 'erro');
  });

  document.getElementById('form_cancelar').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!atual) { toast('Carregue um agendamento primeiro.', 'erro'); return; }
    if (!confirm('Cancelar o agendamento #' + atual.id + '?')) return;
    const r = await deletarAgendamento(atual.id);
    if (r.sucesso) {
      toast('Agendamento cancelado.', 'info');
      window.location.href = 'perfil.html';
    } else toast('Erro: ' + r.erro, 'erro');
  });
</script>

</body>
</html>
